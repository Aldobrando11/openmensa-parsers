name: Update OpenMensa Feeds

on:
  schedule:
    # Runs daily at 05:00 UTC (07:00 CEST)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate XML Feeds using parse.py
        run: |
          mkdir -p public
          # Generate full.xml
          python3 parse.py thueringen ge-freundschaft full.xml > public/full.xml

          # Generate today.xml
          python3 parse.py thueringen ge-freundschaft today.xml > public/today.xml

          cp public/full.xml public/data.xml

          cat << 'EOF' > public/index.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <openmensa-index xmlns="http://openmensa.org/open-mensa-v2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://openmensa.org/open-mensa-v2 http://openmensa.org/open-mensa-v2.xsd">
              <canteen>
                  <name>Mensa Weg der Freundschaft</name>
                  <url>https://aldobrando11.github.io/openmensa-parsers/full.xml</url>
              </canteen>
          </openmensa-index>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
